<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>甜甜AI日报 - {{DATE}}</title>
  <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink-50: #fdf2f8;
      --pink-100: #fce7f3;
      --pink-200: #fbcfe8;
      --pink-300: #f9a8d4;
      --pink-400: #f472b6;
      --pink-500: #ec4899;
      --pink-600: #db2777;
      --pink-700: #be185d;
      --bg: #faf5ff;
      --card-bg: #ffffff;
      --text: #1e1b4b;
      --text-secondary: #6b7280;
      --border: #e5e7eb;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.08), 0 4px 10px -6px rgba(0,0,0,0.04);
      --radius: 16px;
      --radius-sm: 10px;
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      background: linear-gradient(135deg, #fdf2f8 0%, #faf5ff 30%, #eff6ff 70%, #fdf2f8 100%);
      background-attachment: fixed;
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Decorative Background ===== */
    .bg-decoration {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }
    .bg-decoration-1 {
      width: 500px; height: 500px;
      background: var(--pink-300);
      top: -150px; right: -100px;
    }
    .bg-decoration-2 {
      width: 400px; height: 400px;
      background: #a78bfa;
      bottom: -100px; left: -100px;
    }
    .bg-decoration-3 {
      width: 300px; height: 300px;
      background: var(--pink-200);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }

    /* ===== Container ===== */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 20px 60px;
      position: relative;
      z-index: 1;
    }

    /* ===== Header ===== */
    .header {
      text-align: center;
      padding: 48px 20px 36px;
      position: relative;
    }
    .header-icon {
      font-size: 48px;
      margin-bottom: 8px;
      display: block;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .header h1 {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--pink-600) 0%, #a855f7 50%, var(--pink-500) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
    }
    .header .subtitle {
      margin-top: 8px;
      color: var(--text-secondary);
      font-size: 15px;
    }
    .header .count-badge {
      display: inline-block;
      margin-top: 12px;
      padding: 4px 16px;
      background: linear-gradient(135deg, var(--pink-100), #ede9fe);
      border-radius: 20px;
      font-size: 13px;
      color: var(--pink-600);
      font-weight: 600;
    }

    /* ===== Tag Filters ===== */
    .tag-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 32px;
      padding: 0 4px;
    }
    .tag-btn {
      padding: 6px 16px;
      border: 1.5px solid var(--pink-200);
      background: var(--card-bg);
      color: var(--pink-600);
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: var(--transition);
      font-weight: 500;
      font-family: inherit;
      white-space: nowrap;
    }
    .tag-btn:hover {
      background: var(--pink-50);
      border-color: var(--pink-400);
      transform: translateY(-1px);
    }
    .tag-btn.active {
      background: linear-gradient(135deg, var(--pink-500), var(--pink-600));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 2px 8px rgba(236, 72, 153, 0.3);
    }

    /* ===== News Grid ===== */
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* ===== News Card ===== */
    .news-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px 28px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    .news-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(180deg, var(--pink-400), #a78bfa);
      border-radius: 4px 0 0 4px;
      opacity: 0;
      transition: opacity var(--transition);
    }
    .news-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
      border-color: var(--pink-200);
    }
    .news-card:hover::before { opacity: 1; }

    /* Card Header */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .source-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 3px 10px;
      border-radius: 12px;
    }
    .source-techcrunch { background: #dcfce7; color: #16a34a; }
    .source-theverge { background: #dbeafe; color: #2563eb; }
    .source-hackernews { background: #fee2e2; color: #dc2626; }
    .source-other { background: #f3e8ff; color: #9333ea; }
    .card-number {
      font-size: 13px;
      font-weight: 700;
      color: var(--pink-300);
      letter-spacing: 1px;
    }

    /* Card Title */
    .card-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 10px;
    }
    .card-title a {
      color: var(--text);
      text-decoration: none;
      transition: color var(--transition);
    }
    .card-title a:hover {
      color: var(--pink-500);
    }
    .card-title a::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* Card Summary */
    .card-summary {
      font-size: 14.5px;
      color: #4b5563;
      line-height: 1.8;
      position: relative;
      z-index: 2;
      pointer-events: none;
    }

    /* Card Footer */
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 16px;
      position: relative;
      z-index: 2;
    }
    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .card-tag {
      font-size: 11px;
      padding: 2px 10px;
      background: var(--pink-50);
      color: var(--pink-600);
      border-radius: 10px;
      font-weight: 500;
      pointer-events: none;
    }
    .read-more {
      font-size: 13px;
      color: var(--pink-500);
      text-decoration: none;
      font-weight: 600;
      white-space: nowrap;
      transition: var(--transition);
      padding: 4px 8px;
      border-radius: 6px;
    }
    .read-more:hover {
      background: var(--pink-50);
      color: var(--pink-600);
    }

    /* ===== Footer ===== */
    .page-footer {
      text-align: center;
      padding: 48px 20px 24px;
      color: var(--text-secondary);
      font-size: 13px;
    }
    .page-footer .heart {
      color: var(--pink-400);
    }

    /* ===== Empty State ===== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }

    /* ===== Not Found State (JS filter) ===== */
    .not-found {
      display: none;
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
      font-size: 15px;
    }

    /* ===== Responsive ===== */
    @media (max-width: 640px) {
      .container { padding: 12px 12px 40px; }
      .header { padding: 32px 12px 24px; }
      .header h1 { font-size: 24px; }
      .news-card { padding: 18px 20px; }
      .card-title { font-size: 16px; }
      .card-summary { font-size: 13.5px; }
      .card-footer { flex-direction: column; gap: 10px; align-items: flex-start; }
      .tag-btn { font-size: 12px; padding: 5px 12px; }
    }

    /* ===== Print ===== */
    @media print {
      body { background: #fff; }
      .bg-decoration { display: none; }
      .news-card { break-inside: avoid; box-shadow: none; border: 1px solid #ddd; }
    }
  </style>
</head>
<body>
  <div class="bg-decoration bg-decoration-1"></div>
  <div class="bg-decoration bg-decoration-2"></div>
  <div class="bg-decoration bg-decoration-3"></div>

  <div class="container">
    <!-- Header -->
    <header class="header">
      <span class="header-icon">🍩</span>
      <h1>甜甜AI日报 · {{DATE}} {{WEEKDAY}}</h1>
      <p class="subtitle">精选全球AI资讯，十分钟掌握行业动态</p>
      <span class="count-badge">今日精选 {{TOTAL_COUNT}} 条</span>
    </header>

    <!-- Tag Filters -->
    <div class="tag-filters">
      <button class="tag-btn active" data-filter="all">全部</button>
      {{FILTER_BUTTONS}}
    </div>

    <!-- News Grid -->
    <div class="news-grid">
      {{NEWS_ITEMS}}
    </div>

    <!-- Not Found -->
    <div class="not-found" id="not-found">
      <p>没有找到匹配的资讯，试试其他标签～</p>
    </div>

    <!-- Footer -->
    <footer class="page-footer">
      <p>Made with <span class="heart">&#10084;</span> by 甜甜 AI 小助手 · {{DATE}}</p>
      <p style="margin-top: 4px; font-size: 12px;">资讯来源：TechCrunch / The Verge / Hacker News</p>
    </footer>
  </div>

  <script>
    // Tag filter functionality
    document.addEventListener('DOMContentLoaded', function () {
      const buttons = document.querySelectorAll('.tag-btn');
      const cards = document.querySelectorAll('.news-card');
      const notFound = document.getElementById('not-found');

      buttons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          const filter = this.dataset.filter;

          // Update active button
          buttons.forEach(function (b) { b.classList.remove('active'); });
          this.classList.add('active');

          // Filter cards
          let visibleCount = 0;
          cards.forEach(function (card) {
            const tags = card.dataset.tags || '';
            if (filter === 'all' || tags.split(',').includes(filter)) {
              card.style.display = '';
              visibleCount++;
            } else {
              card.style.display = 'none';
            }
          });

          // Show/hide not-found message
          notFound.style.display = visibleCount === 0 ? 'block' : 'none';
        });
      });
    });
  </script>
</body>
</html>
