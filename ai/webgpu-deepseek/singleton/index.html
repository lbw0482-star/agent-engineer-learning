<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单例模式打开窗口</title>
</head>
<body>
  <button id="openBtn">打开新网页</button>
  <script>
    class Popup {
      static ins; // 单例实例 静态属性  不需要先new Popup.ins
      static getInstance() {
        if (!Popup.ins) {
          Popup.ins = new Popup();
        }
        return Popup.ins;
      }
      open(url) {
        window.open(url, '_blank');
      }
    }
    const a = Popup.getInstance(); // 单例方式， 替代new 
    const b = Popup.getInstance(); 
    console.log(a === b);
    const openBtn = document.getElementById("openBtn");
    openBtn.addEventListener("click", () => {
      // window.open("https://www.baidu.com", "_blank");
      a.open("https://www.baidu.com");
    });
  </script>
</body>
</html>
